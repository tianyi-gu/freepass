appId: org.thefountainfund.freepass.app
name: Community board is readable as guest, posting requires sign-in
---
- launchApp:
    clearState: true
- runFlow: helpers/prepare-signup.yaml
- tapOn: "Continue as Guest"
- assertVisible: "QUICK ACCESS"
- tapOn: "Open menu"
- waitForAnimationToEnd
- tapOn: ".*Community Board.*"
- assertVisible: "Community Board"
# Guests can read the board but must sign in to post
- assertVisible: ".*Sign in to post.*"
- assertNotVisible: "Write a message..."
