appId: org.thefountainfund.freepass.app
name: Login from a fresh install completes (no indefinite spinner)
# Supply MAESTRO_EMAIL and MAESTRO_PASSWORD through the test process environment.
---
# clearState: the guest home screen has no CREATE FREE ACCOUNT button, so
# this flow must start from a fresh install regardless of prior runs.
- launchApp:
    clearState: true
- tapOn: ".*CREATE FREE ACCOUNT.*"
- tapOn: "LOG IN"
- assertVisible: "Welcome Back"
- tapOn: "Enter your email..."
- inputText: ${MAESTRO_EMAIL}
- pressKey: Enter
- waitForAnimationToEnd
- tapOn: "Enter your password..."
- inputText: ${MAESTRO_PASSWORD}
- pressKey: Enter
- waitForAnimationToEnd
- tapOn:
    text: "LOG IN"
    index: 0
# Login must resolve one way or the other within the app's request timeout.
- extendedWaitUntil:
    visible: "QUICK ACCESS"
    timeout: 25000
- tapOn: "Open menu"
- tapOn:
    text: ".*Account.*"
    index: 0
- assertVisible: ${MAESTRO_EMAIL}
