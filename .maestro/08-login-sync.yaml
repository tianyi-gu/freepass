appId: org.thefountainfund.freepass.app
name: Login from a fresh install completes (no indefinite spinner)
# Uses the App Review demo account by default; override with
#   maestro test -e EMAIL=... -e PASSWORD=... .maestro/08-login-sync.yaml
# (The July e2e Gmail account's credentials no longer work.)
env:
  EMAIL: applereview@freepass-demo.app
  PASSWORD: ReviewFreePass#2026
---
# clearState: the guest home screen has no CREATE FREE ACCOUNT button, so
# this flow must start from a fresh install regardless of prior runs.
- launchApp:
    clearState: true
- tapOn: ".*CREATE FREE ACCOUNT.*"
- tapOn: "LOG IN"
- assertVisible: "Welcome Back"
- tapOn: "Enter your email..."
- inputText: ${EMAIL}
- pressKey: Enter
- waitForAnimationToEnd
- tapOn: "Enter your password..."
- inputText: ${PASSWORD}
- pressKey: Enter
- waitForAnimationToEnd
- tapOn:
    text: "LOG IN"
    index: 0
# Login must resolve one way or the other within the app's request timeout.
- extendedWaitUntil:
    visible: "QUICK ACCESS"
    timeout: 25000
