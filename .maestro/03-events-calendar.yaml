appId: org.thefountainfund.freepass.app
name: Event calendar shows real entries or an honest empty state
---
- launchApp:
    clearState: true
- assertVisible: "QUICK ACCESS"
- tapOn: ".*Events.*"
- extendedWaitUntil:
    visible: ".*(SHARE|No upcoming events).*"
    timeout: 20000
- assertNotVisible: ".*Could not load events.*"
- runFlow:
    when:
      visible: ".*SEE DETAILS.*"
    commands:
      - tapOn:
          text: ".*SEE DETAILS.*"
          index: 0
      - scrollUntilVisible:
          element: ".*SHARE EVENT.*"
      - assertVisible: ".*SHARE EVENT.*"
