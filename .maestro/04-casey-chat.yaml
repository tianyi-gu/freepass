appId: org.thefountainfund.freepass.app
name: Casey AI replies to a housing question
---
- launchApp
- tapOn: ".*Casey.*"
# The AI data-sharing decision is persisted per device, so make the
# precondition deterministic whatever state a previous run (or manual
# testing) left behind:
#  - declined earlier  -> "Casey is turned off" screen; ask for the notice again
#  - never asked       -> notice is shown directly
#  - accepted earlier  -> chat is shown; both blocks are skipped
- runFlow:
    when:
      visible: "Casey is turned off"
    commands:
      - tapOn: "Review the AI notice and turn on Casey"
- runFlow:
    when:
      visible: "Before you chat with Casey"
    commands:
      - assertVisible: "Who receives it"
      - assertVisible: ".*Google \\(Gemini\\).*"
      - assertVisible: ".*Groq.*"
      - assertVisible: ".*OpenAI.*"
      # The notice is taller than the screen on most phones; the accept
      # button is below the fold.
      - scrollUntilVisible:
          element: "I agree, turn on Casey"
          direction: DOWN
      - tapOn: "I agree, turn on Casey"
- assertVisible: "Message Casey..."
- tapOn: "Message Casey..."
- inputText: "Where can I find housing help in Philadelphia?"
- tapOn: "Send"
- extendedWaitUntil:
    visible:
      text: ".*ousing.*"
    timeout: 45000
- assertNotVisible: ".*having trouble connecting right now.*"
